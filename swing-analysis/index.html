<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASENEFIT 揮棒 3D 預覽</title><style>body{margin:0;background:#081725;color:#e8f4ff;font:16px system-ui}header{padding:16px;background:#102c46;font-weight:800}main{max-width:900px;margin:auto;padding:12px}canvas{display:block;width:100%;height:440px;touch-action:none;background:radial-gradient(#173b53,#081725);border-radius:14px}button,input{font:inherit}button{background:#17658b;color:white;border:0;border-radius:9px;padding:12px;margin:4px}input{width:100%}.note{background:#173047;padding:12px;border-radius:10px;line-height:1.6}small{color:#b9d3e2}</style><header>BASENEFIT | 3D 揮棒動作預覽 V1.1</header><main><canvas id="cv"></canvas><p><button id="play">▶ 播放 3D</button><button id="back">◀ 前一格</button><button id="next">後一格 ▶</button><button id="reset">重設視角</button></p><input id="time" type="range" min="0" max="100" value="0"><p id="status">揮棒進度 0%</p><div class="note"><b>操作：</b>手指拖曳可旋轉視角，滑桿可逐格查看。<br><b>精度限制：</b>此為示意性 3D 人體骨架與棒頭軌跡，尚未從影片逐格進行 3D 姿態重建；軌跡、角度、速度均非實測。<br><b>原始影片：</b>尚未部署到此頁，因此不顯示失效的 0:00 播放器。</div></main><script>
const c=document.querySelector('#cv'),ctx=c.getContext('2d');let az=.4,el=.2,t=0,playing=false,last=0,drag=false,px=0,py=0;
const lerp=(a,b,t)=>a+(b-a)*t;
function point(p){let [x,y,z]=p,ca=Math.cos(az),sa=Math.sin(az);let xx=x*ca-z*sa,zz=x*sa+z*ca,yy=y*Math.cos(el)-zz*Math.sin(el);let d=5+zz*Math.cos(el)+y*Math.sin(el);let s=Math.min(c.width,c.height)*.72/d;return [c.width/2+xx*s,c.height*.77-yy*s];}
function line(a,b,color,w=4){let A=point(a),B=point(b);ctx.strokeStyle=color;ctx.lineWidth=w*devicePixelRatio;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke()}
function ball(p,r,col){let [x,y]=point(p);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r*devicePixelRatio,0,Math.PI*2);ctx.fill()}
function pose(u){let swing=Math.max(0,Math.min(1,(u-.16)/.6));let a=-1.35+swing*3.1;let hip=.12*Math.sin(swing*Math.PI);let shoulder=[.05,1.56,hip],pelvis=[0,1.02,0];let hand=[.45*Math.cos(a),1.38+.20*Math.sin(a),.48*Math.sin(a)];let tip=[hand[0]+.95*Math.cos(a+.22),hand[1]+.95*Math.sin(a+.22),hand[2]+.20];return {shoulder,pelvis,hand,tip};}
function draw(){let w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.clearRect(0,0,c.width,c.height);let g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#102e47');g.addColorStop(1,'#06131f');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);for(let i=-3;i<=3;i++){line([i*.5,0,-1.5],[i*.5,0,1.5],'#244354',1);line([-1.5,0,i*.5],[1.5,0,i*.5],'#244354',1)}
let p=pose(t),hip=p.pelvis,sh=p.shoulder;line([-.15,.08,-.13],[-.2,.58,-.12],'#d9ecfa',7);line([-.2,.58,-.12],[-.13,1.0,-.1],'#d9ecfa',7);line([.22,.08,.13],[.18,.58,.12],'#d9ecfa',7);line([.18,.58,.12],[.12,1,.1],'#d9ecfa',7);line(hip,sh,'#5cc8ed',13);line([-.24,1.53,-.05],[.24,1.53,.05],'#5cc8ed',8);line([-.22,1.52,-.05],[-.16,1.26,.15],'#d9ecfa',7);line([-.16,1.26,.15],p.hand,'#d9ecfa',6);line([.22,1.52,.05],[.36,1.31,.15],'#d9ecfa',7);line([.36,1.31,.15],p.hand,'#d9ecfa',6);ball([0,1.83,0],15,'#f2c7a4');line(p.hand,p.tip,'#35bfff',8);ball(p.tip,5,'#ffdd69');
let prev=null;for(let i=0;i<=80*t;i++){let q=pose(i/80).tip;if(prev)line(prev,q,'#ffb544',2.5);prev=q;}document.querySelector('#status').textContent='揮棒進度 '+Math.round(t*100)+'%｜拖曳畫面可旋轉';}
function step(now){if(playing){t=(t+(now-last)/2200)%1;document.querySelector('#time').value=Math.round(t*100)}last=now;draw();requestAnimationFrame(step)}requestAnimationFrame(step);
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'⏸ 暫停':'▶ 播放 3D'};
document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-.03);document.querySelector('#time').value=t*100};
document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(1,t+.03);document.querySelector('#time').value=t*100};
document.querySelector('#reset').onclick=()=>{az=.4;el=.2;t=0;playing=false;document.querySelector('#time').value=0};
document.querySelector('#time').oninput=e=>{playing=false;t=+e.target.value/100};
c.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!drag)return;az+=(e.clientX-px)*.012;el=Math.max(-1,Math.min(1,el+(e.clientY-py)*.008));px=e.clientX;py=e.clientY};
c.onpointerup=()=>drag=false;c.onpointercancel=()=>drag=false;
</script></html>
