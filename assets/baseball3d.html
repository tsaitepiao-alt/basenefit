<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>basenefit｜棒球場互動學習（向量版）</title>
<style>
 html,body{margin:0;height:100%;background:#0d1017;overflow:hidden;
   font-family:-apple-system,"PingFang TC","Heiti TC",sans-serif;color:#e9eaee;-webkit-text-size-adjust:100%}
 #stage{position:fixed;inset:0}
 svg{width:100%;height:100%;display:block;touch-action:manipulation}
 .panel{position:fixed;background:rgba(20,24,32,.93);border:1px solid #2f3846;border-radius:12px}
 #t{top:12px;left:12px;padding:11px 15px;font-size:13px;line-height:1.6;max-width:44vw}
 #t b{font-size:15.5px}
 #spec{top:12px;right:12px;padding:11px 15px;font-size:12.5px;line-height:1.75;max-width:32vw;max-height:72vh;overflow:auto}
 #spec h4{margin:0 0 6px;font-size:13.5px;color:#ffcf9a}
 #spec i{color:#8fd7ff;font-style:normal}
 button{background:#232937;color:#e9eaee;border:1px solid #39404f;border-radius:9px;
   padding:9px 13px;font-size:13px;cursor:pointer;font-family:inherit}
 button.on{background:#2f6fd6;border-color:#2f6fd6;color:#fff}
 #c2{bottom:12px;right:12px;padding:8px 11px;display:flex;gap:6px;flex-wrap:wrap}
 #finfo{bottom:12px;left:12px;padding:12px 15px;font-size:12.8px;line-height:1.7;max-width:340px;display:none}
 #finfo h4{margin:0 0 7px;font-size:14.5px;color:#cbf24c}
 #finfo b{color:#8fd7ff;font-weight:600}
 #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:12.5px;color:#b9c2d0;background:rgba(20,24,32,.8);padding:5px 12px;border-radius:8px}
 .hot{cursor:pointer}
 .hot:hover{filter:brightness(1.15)}
 @media(max-width:760px){
   #t,#spec{display:none}
   #finfo{left:8px;right:8px;bottom:64px;max-width:none;font-size:12.5px}
   #c2{left:8px;right:8px;bottom:10px;padding:6px 8px}
   #c2 button{flex:1 1 0;padding:10px 4px;font-size:12.5px}
   #hint{display:none}
 }
</style></head><body>
<div id="stage"></div>
<div id="t" class="panel"><b>棒球場互動學習</b><br><span style="color:#9aa2b1">點選場上任何區域 → 顯示 MLB 真實規格</span></div>
<div id="spec" class="panel"><h4>球場規格（MLB）</h4><div id="sb"></div></div>
<div id="finfo" class="panel"></div>
<div id="c2" class="panel">
  <button id="v1" class="on">立體</button><button id="v2">俯視</button><button id="m6">📐 數據</button><button id="m7">⚾ 3D 模型</button>
</div>
<div id="hint">點選場地元素看規格</div>
<script>
var INFO = {"outfield": ["外野草區（割草條紋）", ["邊線 99.06 m（325 ft）", "中外野 121.92 m（400 ft）", "界外線夾角 90°", "草區半徑依 325–400 ft 弧線變化"]], "infield": ["內野沙土區", ["壘間 27.43 m（90 ft）", "本壘 → 投手板 18.44 m（60 ft 6 in）", "內野土弧半徑 28.96 m（95 ft）", "壘包 38.1 × 38.1 cm（15 in）"]], "track": ["警戒區", ["寬度 3 m（此圖設定）", "MLB 標準 15 ft ≈ 4.6 m", "提醒野手接近全壘打牆"]], "wall": ["全壘打牆", ["邊線 99.06 m（325 ft）", "中外野 121.92 m（400 ft）", "高度 3 m・牆頂黃線", "距離牌 325／347／368／400 ft"]], "plate": ["本壘板", ["43.18 × 21.6 cm（17 × 8.5 in）", "五角形，尖端朝捕手", "好球帶寬度由此決定"]], "base": ["壘包", ["38.1 × 38.1 cm（15 in）正方", "厚 7.6–12.7 cm", "壘間 27.43 m（90 ft）", "二壘包旋轉 45°"]], "mound": ["投手丘", ["半徑 2.74 m（9 ft）", "高 25.4 cm（10 in）", "投手板距本壘 18.44 m"]], "rubber": ["投手板", ["61 × 15.2 cm（24 × 6 in）", "距本壘 18.44 m（60 ft 6 in）"]], "box": ["打擊區", ["1.22 × 1.83 m（4 × 6 ft）", "左右各一", "距本壘板約 15 cm"]], "cbox": ["捕手區", ["1.37 × 2.44 m", "本壘板後方", "界外球接殺判定範圍"]], "foul": ["界外桿", ["標示界內／界外", "延伸線通過壘線端點", "職業高度 15.2 m 以上"]], "baseline": ["壘線", ["本壘→一壘→二壘→三壘", "每段 27.43 m（90 ft）", "滾地球界內外判定依據"]], "ondeck": ["練習圈", ["半徑 1.5 m", "下一棒打者的準備區", "位於一、三壘側界外區"]], "coach": ["教練區", ["3.2 × 1.8 m", "一、三壘側各一"]], "foularea": ["界外區（foul territory）", ["壘線以外的區域", "界外飛球接殺也算出局", "練習圈、教練區、捕手區都在此區"]], "homecircle": ["本壘土圈", ["半徑 3.8 m", "打者與捕手活動範圍"]], "stand": ["看台", ["灰色環形觀眾席", "本壘後方與外野後方皆有", "極簡向量風格"]], "scoreboard": ["計分板", ["中外野正後方", "深綠建築＋淺綠窗格", "顯示局數、比分、好壞球"]]}, SPEC = [["壘間距離", "27.43 m（90 ft）"], ["投手板→本壘", "18.44 m（60 ft 6 in）"], ["投手丘", "半徑 2.74 m（9 ft）・高 25.4 cm（10 in）"], ["本壘板", "43.18 × 21.6 cm（17 × 8.5 in）・五角形"], ["壘包", "38.1 cm 正方・厚 7.6–12.7 cm"], ["內野土弧", "半徑 28.96 m（95 ft）"], ["全壘打牆", "邊線 99.06 m（325 ft）・中外野 121.92 m（400 ft）"], ["警戒區", "寬 4.6 m（15 ft，MLB 標準）"], ["打擊區", "1.22 × 1.83 m（4 × 6 ft）"], ["投手板", "61 × 15.2 cm（24 × 6 in）"]];
var Q = 0.62;

var D=90*0.3048, R2=D*Math.SQRT2, B45=D*Math.SQRT1_2;
var MOUND=18.44, MR=2.74, ARC=28.96;
var WL=99.06, WCF=121.92, TRACK=4.6, RING=WCF+26;   // 外野牆後留約 26 m 綠帶（約球場半徑 1/5）

function wallR(t){ return WL+(WCF-WL)*Math.sin(Math.PI*t); }
function wallAng(t){ return -Math.PI/4+Math.PI/2*t; }
function wallPt(t){ var a=wallAng(t), r=wallR(t); return [Math.sin(a)*r, Math.cos(a)*r]; }

var W=1000,H=1000,S=1,CX=500,CY=500;
function fitViewport(){ W=Math.max(320, innerWidth||1000); H=Math.max(320, innerHeight||1000); }
function fit(){
  fitViewport();
  var zTop = RING*1.05, zBot = -RING*1.05, xHalf = RING*1.06;
  var spanX = xHalf*2, spanY = (zTop-zBot)*Q;
  S = Math.min(W/spanX, H/spanY)*0.98;
  CX = W/2; CY = H/2 + ((zTop+zBot)/2)*S*Q;
}
window.addEventListener('resize', function(){ render(); });
function P(x,z,y){ y=y||0; return [CX+x*S, CY-z*S*Q-y*S]; }
function poly(list){ return list.map(function(p){ var q=P(p[0],p[1]); return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' '); }
function closed(list){ return '<path d="M'+poly(list).split(' ').join('L')+' Z"'; }
function ring(r,a0,a1,n){ var o=[]; for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; o.push([Math.sin(a)*r, Math.cos(a)*r]); } return o; }
function wallPath(t0,t1,n,off){ var o=[]; for(var i=0;i<=n;i++){ var t=t0+(t1-t0)*i/n, a=wallAng(t), r=wallR(t)-(off||0); o.push([Math.sin(a)*r, Math.cos(a)*r]); } return o; }

var pieces = [];
function put(s){ pieces.push(s); }

function build(){
  pieces = []; fit();
  var rectIn = RING-16;
  put('<rect width="'+W+'" height="'+H+'" fill="#0d1017"/>');
  var rxO=RING*S, ryO=RING*S*Q, rxI=rectIn*S, ryI=rectIn*S*Q;
  var rxm=(rxO+rxI)/2, rym=(ryO+ryI)/2, wSeg=(rxO-rxI);
  put('<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+rxm.toFixed(1)+'" ry="'+rym.toFixed(1)+'" fill="none" stroke="#b8b8b8" stroke-width="'+wSeg.toFixed(1)+'"/>');
  for(var i=0;i<28;i++){
    var a=i/28*Math.PI*2, c=Math.cos(a), s2=Math.sin(a);
    put('<line x1="'+(CX+c*rxI).toFixed(1)+'" y1="'+(CY+s2*ryI).toFixed(1)+'" x2="'+(CX+c*rxO).toFixed(1)+'" y2="'+(CY+s2*ryO).toFixed(1)+
        '" stroke="#ffffff" stroke-width="1.8" opacity=".8"/>');
  }
  put('<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+rxO.toFixed(1)+'" ry="'+ryO.toFixed(1)+'" fill="none" stroke="#e6e8ec" stroke-width="2.4"/>');
  put('<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+rxI.toFixed(1)+'" ry="'+ryI.toFixed(1)+'" fill="none" stroke="#ffffff" stroke-width="2"/>');
  put('<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+(rxI+1).toFixed(1)+'" ry="'+(ryI+1).toFixed(1)+'" fill="#417725"/>');
  // 場外綠地割草紋（同心帶，讓綠地有層次）
  for(var g2=1;g2<=3;g2++){
    var rr=(rxI)*(0.55+g2*0.14);
    put('<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+rr.toFixed(1)+'" ry="'+(rr*Q).toFixed(1)+
        '" fill="none" stroke="#4a8629" stroke-width="'+(rxI*0.055).toFixed(1)+'" opacity=".85"/>');
  }
  // 看台分層（5 階同心帶）
  for(var t2=0;t2<5;t2++){
    var mRx=rxI+wSeg*((t2+0.5)/5), mRy=ryI+wSeg*((t2+0.5)/5);
    put('<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+mRx.toFixed(1)+'" ry="'+mRy.toFixed(1)+
        '" fill="none" stroke="'+(t2%2?'#a3a3a7':'#c9c9cd')+'" stroke-width="'+(wSeg/5).toFixed(1)+'" opacity=".9"/>');
  }
  // 界外區：從三壘界外繞本壘後方到一壘界外（單一扇形）
  (function(){
    var list=[[0,0]];
    list=list.concat(ring(rectIn, Math.PI/4, Math.PI*1.75, 70));
    list.push([0,0]);
    put(closed(list)+' fill="#3f7f2b" class="hot" data-info="foularea"/>');
  })();
  // 割草條紋
  var N=14;
  for(var k=0;k<N;k++){
    var list2=[[0,0]].concat(wallPath(k/N,(k+1)/N,8,0));
    list2.push([0,0]);
    put(closed(list2)+' fill="'+(k%2?'#5d9835':'#316a25')+'"/>');
  }
  // 警戒區（MLB 標準 4.6 m，暖土色＋深色邊界）
  (function(){
    var outer=wallPath(0,1,60,0), inner=wallPath(0,1,60,TRACK*1.7).reverse();
    put(closed(outer.concat(inner))+' fill="#c09263" class="hot" data-info="track"/>');
    put('<path d="M'+poly(wallPath(0,1,60,TRACK*1.7))+'" fill="none" stroke="#7a5530" stroke-width="2.2" opacity=".8"/>');
    put('<path d="M'+poly(wallPath(0,1,60,0.4))+'" fill="none" stroke="#7a5530" stroke-width="1.8" opacity=".6"/>');
  })();
  // 全壘打牆（深綠厚帶＋黃頂線＋陰影）
  put('<path d="M'+poly(wallPath(0,1,80,0))+'" fill="none" stroke="#12380f" stroke-width="'+(9*S)+'" stroke-linejoin="round" opacity=".85"/>');
  put('<path d="M'+poly(wallPath(0,1,80,-1.2))+'" fill="none" stroke="#276a2a" stroke-width="'+(6*S)+'" stroke-linejoin="round" class="hot" data-info="wall"/>');
  put('<path d="M'+poly(wallPath(0,1,80,-2.6))+'" fill="none" stroke="#e8c33a" stroke-width="2.2" opacity=".95"/>');
  // 內野沙土
  (function(){
    var list3=[[0,0],[B45,B45]];
    list3=list3.concat(ring(ARC, Math.PI/4, -Math.PI/4, 40).map(function(p){ return [p[0], MOUND+p[1]]; }));
    list3.push([-B45,B45],[0,0]);
    put(closed(list3)+' fill="#c4ab8a" class="hot" data-info="infield"/>');
  })();
  // 本壘土圈
  var o0=P(0,0);
  put('<ellipse cx="'+o0[0]+'" cy="'+o0[1]+'" rx="'+(3.6*S)+'" ry="'+(3.6*S*Q)+'" fill="#cdb391" class="hot" data-info="homecircle"/>');
  // 壘線＋界外線
  var lines=[[[0,0],[B45,B45]],[[B45,B45],[0,R2]],[[0,R2],[-B45,B45]],[[-B45,B45],[0,0]]];
  for(var i2=0;i2<lines.length;i2++){
    var L=lines[i2], p1=P(L[0][0],L[0][1]), p2=P(L[1][0],L[1][1]);
    put('<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+
        '" stroke="#ffffff" stroke-width="'+(0.16*S)+'" opacity=".9" class="hot" data-info="baseline"/>');
  }
  for(var sg=1;sg>=-1;sg-=2){
    var e=P(sg*Math.sin(Math.PI/4)*WL, Math.cos(Math.PI/4)*WL), o=P(0,0);
    put('<line x1="'+o[0].toFixed(1)+'" y1="'+o[1].toFixed(1)+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+
        '" stroke="#ffffff" stroke-width="'+(0.18*S)+'" opacity=".9" class="hot" data-info="baseline"/>');
  }
  // 壘包（視覺放大）
  [[B45,B45],[0,R2],[-B45,B45]].forEach(function(b){
    var p=P(b[0],b[1]), r=Math.max(0.38*S, 6.5);
    put('<path d="M'+p[0]+','+(p[1]-r)+' L'+(p[0]+r)+','+p[1]+' L'+p[0]+','+(p[1]+r)+' L'+(p[0]-r)+','+p[1]+
        ' Z" fill="#fff" stroke="#2b3037" stroke-width="2.2" class="hot" data-info="base"/>');
  });
  // 本壘板
  (function(){
    var w=Math.max(0.4318*S,11), dd=w*0.5, o=P(0,0);
    put('<path d="M'+(o[0]-w/2)+','+o[1]+' L'+(o[0]+w/2)+','+o[1]+' L'+(o[0]+w/2)+','+(o[1]+dd*0.55)+
        ' L'+o[0]+','+(o[1]+dd)+' L'+(o[0]-w/2)+','+(o[1]+dd*0.55)+
        ' Z" fill="#fff" stroke="#2b3037" stroke-width="2.2" class="hot" data-info="plate"/>');
  })();
  // 本壘後方擋球網（弧線）
  (function(){
    var pts=[];
    for(var i=0;i<=20;i++){ var a=Math.PI/2 + (Math.PI*0.72)*(i/20-0.5)*2; var r=9.5;
      pts.push([Math.sin(a)*r, Math.cos(a)*r]); }
    put('<path d="M'+poly(pts)+'" fill="none" stroke="#c9ced6" stroke-width="3" stroke-dasharray="7 4" opacity=".8"/>');
  })();
  // 投手丘＋投手板
  (function(){
    var c=P(0,MOUND);
    put('<ellipse cx="'+c[0]+'" cy="'+c[1]+'" rx="'+(MR*S*1.05)+'" ry="'+(MR*S*Q*1.05)+'" fill="#c9ae8c" stroke="#a58862" stroke-width="1.6"/>');
    put('<ellipse cx="'+c[0]+'" cy="'+c[1]+'" rx="'+(MR*S)+'" ry="'+(MR*S*Q)+'" fill="#d9bd97" stroke="#b99a6d" stroke-width="1.6" class="hot" data-info="mound"/>');
    var w=Math.max(0.61*S,6), h=Math.max(0.4*S*Q,3);
    put('<rect x="'+(c[0]-w/2).toFixed(1)+'" y="'+(c[1]-h/2).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+
        '" rx="1" fill="#fff" stroke="#7f858d" stroke-width="1.2" class="hot" data-info="rubber"/>');
  })();
  // 打擊區／捕手區／練習圈／教練區
  function box(cx,cz,w,dd,key){
    var a=P(cx-w/2,cz-dd/2), b=P(cx+w/2,cz+dd/2);
    put('<rect x="'+Math.min(a[0],b[0]).toFixed(1)+'" y="'+Math.min(a[1],b[1]).toFixed(1)+'" width="'+Math.abs(b[0]-a[0]).toFixed(1)+
        '" height="'+Math.abs(b[1]-a[1]).toFixed(1)+'" fill="rgba(255,255,255,.06)" stroke="#ffffff" stroke-width="1.5" '+
        'stroke-dasharray="5 3" class="hot" data-info="'+key+'"/>');
  }
  [1,-1].forEach(function(s){ box(s*1.83,0.4,1.22,1.83,'box'); });
  box(0,-1.3,1.37,2.44,'cbox');
  [1,-1].forEach(function(s){ box(s*7.6,6.6,3.2,1.8,'coach');
    var o=P(s*9.2,-8.4);
    put('<ellipse cx="'+o[0].toFixed(1)+'" cy="'+o[1].toFixed(1)+'" rx="'+(1.5*S)+'" ry="'+(1.5*S*Q)+
        '" fill="rgba(255,255,255,.05)" stroke="#dfe3e8" stroke-width="1.3" stroke-dasharray="4 3" class="hot" data-info="ondeck"/>');
  });
  // 界外桿（立在看台內緣）
  [0,1].forEach(function(t){
    var p=wallPt(t), q=P(p[0]*1.075, p[1]*1.075);
    put('<line x1="'+q[0].toFixed(1)+'" y1="'+(q[1]+2).toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+(q[1]-11).toFixed(1)+
        '" stroke="#8a6d00" stroke-width="3.2" stroke-linecap="round"/>');
    put('<circle cx="'+q[0].toFixed(1)+'" cy="'+(q[1]-11).toFixed(1)+'" r="3.6" fill="#ffd600" class="hot" data-info="foul"/>');
  });
  // 距離牌
  [[0.0,'325'],[0.18,'347'],[0.34,'368'],[0.5,'400'],[0.66,'368'],[0.82,'347'],[1.0,'325']].forEach(function(m){
    var p=wallPt(m[0]), q=P(p[0]*1.05, p[1]*1.05);
    put('<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+4).toFixed(1)+'" font-size="'+(2.3*S).toFixed(1)+
        '" fill="#ffd9a0" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#0d1017" stroke-width="2">'+m[1]+'</text>');
  });
  // 計分板（含基座）
  (function(){
    var c=P(0,WCF+15); var w=42*S, h=16*S, base=h*0.34;
    put('<path d="M'+(c[0]-w/2-6).toFixed(1)+','+c[1].toFixed(1)+' L'+(c[0]+w/2+6).toFixed(1)+','+c[1].toFixed(1)+
        ' L'+(c[0]+w/2).toFixed(1)+','+(c[1]-base).toFixed(1)+' L'+(c[0]-w/2).toFixed(1)+','+(c[1]-base).toFixed(1)+
        ' Z" fill="#4a4a50" stroke="#6a6a70" stroke-width="1"/>');
    put('<rect x="'+(c[0]-w/2).toFixed(1)+'" y="'+(c[1]-base-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+
        '" rx="4" fill="#276a2a" stroke="#16401a" stroke-width="1.5" class="hot" data-info="scoreboard"/>');
    var cw=(w-4*S)/8, ch=h*0.16;
    for(var ix=0;ix<8;ix++) for(var iy=0;iy<3;iy++){
      put('<rect x="'+(c[0]-w/2+2*S+ix*(cw*1.06)).toFixed(1)+'" y="'+(c[1]-base-h+h*0.17+iy*(ch*1.35)).toFixed(1)+
          '" width="'+(cw*0.88).toFixed(1)+'" height="'+ch.toFixed(1)+'" fill="#8cb68e" rx="1"/>');
    }
    put('<rect x="'+(c[0]-w/2).toFixed(1)+'" y="'+(c[1]-base-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(h*0.11).toFixed(1)+
        '" rx="4" fill="#cfd3d8"/>');
  })();
  // 看台熱區
  put('<ellipse cx="'+CX+'" cy="'+CY+'" rx="'+rxm.toFixed(1)+'" ry="'+rym.toFixed(1)+'" fill="none" stroke="transparent" stroke-width="'+
      wSeg.toFixed(1)+'" class="hot" data-info="stand"/>');
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+pieces.join('')+'</svg>';
}
function render(){ document.getElementById('stage').innerHTML = build(); }
function showInfo(key){
  var info=INFO[key]; if(!info) return;
  var el=document.getElementById('finfo');
  el.innerHTML='<h4>'+info[0]+'</h4>'+info[1].map(function(r){ return '<div><b>'+r+'</b></div>'; }).join('');
  el.style.display='block';
}
document.addEventListener('click', function(e){
  var t=e.target.closest?e.target.closest('.hot'):null;
  if(t && t.dataset && t.dataset.info) showInfo(t.dataset.info);
});
document.getElementById('sb').innerHTML = SPEC.map(function(r){ return '<div>'+r[0]+'：<i>'+r[1]+'</i></div>'; }).join('');
