<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>台中洲際棒球場｜3D 互動球場</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101720;color:#eaf3e5;font:14px/1.6 system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #cbf24c;outline-offset:-3px}
    #status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#101720e8;padding:24px;z-index:2}
    #status[hidden]{display:none}#message{max-width:34em;margin:0 0 12px}progress{width:min(320px,76vw);accent-color:#cbf24c}
    .tools{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:7px;pointer-events:none}
    button,a{font:inherit;border:1px solid #99b9c352;border-radius:9px;padding:8px 12px;color:#edf6f8;background:#142632ee;text-decoration:none;cursor:pointer;pointer-events:auto;min-height:40px}
    button:disabled{opacity:.45;cursor:wait}button:hover,a:hover{background:#254b54}button:focus-visible,a:focus-visible{outline:2px solid #cbf24c}
    .hint{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;font-size:12px;color:#d5e3e9;text-shadow:0 1px 4px #000}
    #retry{margin:auto}#retry[hidden]{display:none}
    #landmarks{position:absolute;inset:0;pointer-events:none}#landmarks[hidden]{display:none}
    #leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#leaders line{stroke:#d5f5a3;stroke-width:1.2;opacity:.8}#leaders circle{fill:#cbf24c;stroke:#102028;stroke-width:1.5}
    .landmark{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;min-height:32px;font-size:12px;background:#152a35f5;box-shadow:0 2px 8px #0006;white-space:nowrap;border-color:#d5f5a370}.landmark[hidden]{display:none}
    button[aria-pressed=true]{background:#cbf24c;color:#142028;border-color:#cbf24c}
    #locations{position:absolute;left:12px;right:12px;top:40px;display:flex;gap:5px;overflow-x:auto;padding-bottom:5px}#locations button{flex-shrink:0;font-size:12px;padding:5px 9px;min-height:34px}
    #info{position:absolute;right:12px;top:88px;width:min(290px,calc(100% - 24px));max-height:calc(100% - 180px);overflow:auto;padding:16px;background:#102331f5;border:1px solid #89a9ad80;border-radius:12px;box-shadow:0 10px 32px #0006}
    #info[hidden]{display:none}#info h2{font-size:20px;margin:0 50px 12px 0;color:#cbf24c}#info h3{font-size:12px;color:#b4c9d0;margin:12px 0 3px}#info p{font-size:13px;margin:0;line-height:1.75}#info small{display:block;font-size:11px;color:#9bb2bd;margin-top:12px}#info-close{position:absolute;right:8px;top:8px;padding:4px 8px;min-height:32px}
    @media(max-width:500px){button,a{padding:7px 10px;font-size:12px}.hint{font-size:11px}}
  </style>
  <script type="importmap">{"imports":{"three":"../tactics/js/vendor/three.module.min.js"}}</script>
</head>
<body>
  <canvas id="field" tabindex="0" aria-label="台中洲際棒球場 3D 模型。拖曳旋轉、滾輪縮放、右鍵拖曳平移；手機雙指縮放與平移。"></canvas>
  <div class="hint">台中洲際棒球場 · 拖曳旋轉／雙指縮放與平移</div>
  <svg id="leaders" aria-hidden="true"></svg><div id="landmarks" aria-label="球場位置標記"></div>
  <nav id="locations" aria-label="選擇球場位置"></nav>
  <aside id="info" hidden aria-live="polite"><button id="info-close" aria-label="關閉位置說明">關閉</button><h2 id="info-name"></h2><h3>用途</h3><p id="info-purpose"></p><h3>規則說明</h3><p id="info-rule"></p><small>依實景掃描作教學定位。部分貼圖不完整；詳細規則以比賽採用規章為準。</small></aside>
  <div id="status" role="status" aria-live="polite"><p id="message">正在準備 3D 球場…</p><progress id="progress" max="100" aria-label="模型下載進度"></progress><button id="retry" hidden>重新載入</button></div>
  <nav class="tools" aria-label="球場視角操作">
    <button id="home" disabled>重設視角</button><button id="top" disabled>俯視球場</button><button id="infield" disabled>內野近看</button><button id="toggle-labels" disabled aria-pressed="true">隱藏標記</button><button id="in" disabled aria-label="放大球場">＋</button><button id="out" disabled aria-label="縮小球場">－</button>
    <a href="taichung-stadium.glb" download>下載模型</a>
  </nav>
  <script>
    window.showError=function(){document.getElementById('status').hidden=false;document.getElementById('message').textContent='球場未能載入。請確認網路後重新載入；若持續失敗，請使用支援 WebGL 的新版瀏覽器。';document.getElementById('progress').hidden=true;document.getElementById('retry').hidden=false;};
    window.addEventListener('unhandledrejection',window.showError);
    window.addEventListener('error',window.showError);
    document.getElementById('retry').onclick=()=>location.reload();
  </script>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from './vendor/OrbitControls.js';
    import {GLTFLoader} from './vendor/GLTFLoader.js';
    import {MeshoptDecoder} from './vendor/meshopt_decoder.mjs';
    import {addLandmarks} from './landmarks.js';
    const canvas=document.getElementById('field'),message=document.getElementById('message'),progress=document.getElementById('progress');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
    renderer.setClearColor(0x101720);renderer.outputColorSpace=THREE.SRGBColorSpace;
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.001,100);
    const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=true;
    controls.maxPolarAngle=Math.PI*.49;controls.listenToKeyEvents(canvas);
    let model=null,radius=1,homePosition=null,homeTarget=null,updateLabels=()=>{};
    function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
    addEventListener('resize',resize);resize();
    const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    message.textContent='正在下載球場模型…';
    loader.load('taichung-stadium.glb',gltf=>{
      model=gltf.scene;
      // Photogrammetry already contains baked lighting in its photographed textures.
      model.traverse(node=>{if(!node.isMesh)return;const convert=old=>{
        const material=new THREE.MeshBasicMaterial({map:old.map,color:old.color,side:THREE.DoubleSide,transparent:old.transparent,opacity:old.opacity});
        if(material.map)material.map.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
        old.dispose();return material;
      };node.material=Array.isArray(node.material)?node.material.map(convert):convert(node.material);});
      const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3());
      model.position.sub(center);scene.add(model);
      const sphere=new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());radius=sphere.radius;
      const halfFov=Math.min(THREE.MathUtils.degToRad(camera.fov)/2,Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*camera.aspect));
      const distance=radius/Math.sin(halfFov)*1.1;
      camera.near=radius/1000;camera.far=radius*120;camera.updateProjectionMatrix();
      controls.minDistance=radius*.08;controls.maxDistance=radius*20;controls.target.copy(sphere.center);
      camera.position.copy(sphere.center).add(new THREE.Vector3(.55,.8,1).normalize().multiplyScalar(distance));
      controls.update();controls.saveState();homePosition=camera.position.clone();homeTarget=controls.target.clone();
      updateLabels=addLandmarks(model,camera,controls,canvas);
      document.querySelectorAll('.tools button').forEach(button=>button.disabled=false);
      document.getElementById('status').hidden=true;
      window.stadiumReady=true;window.stadiumMeshCount=0;model.traverse(n=>{if(n.isMesh)window.stadiumMeshCount++;});
    },event=>{if(event.lengthComputable){const percent=Math.round(event.loaded/event.total*100);progress.value=percent;message.textContent=percent===100?'正在解壓縮與準備貼圖…':`正在下載球場模型… ${percent}%`;}},error=>{console.error('Stadium loading failed',error);window.showError();});
    document.getElementById('home').onclick=()=>{controls.reset();};
    document.getElementById('top').onclick=()=>{if(!model)return;controls.target.copy(homeTarget);camera.up.set(0,1,0);camera.position.copy(homeTarget).add(new THREE.Vector3(0,homePosition.distanceTo(homeTarget),.0001));controls.update();};
    document.getElementById('infield').onclick=()=>{if(!model)return;const center=model.localToWorld(new THREE.Vector3(-.02,.18,-.12));controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(-.05,.85,.45));controls.update();};
    function zoom(factor){const offset=camera.position.clone().sub(controls.target);offset.setLength(THREE.MathUtils.clamp(offset.length()*factor,controls.minDistance,controls.maxDistance));camera.position.copy(controls.target).add(offset);controls.update();}
    document.getElementById('in').onclick=()=>zoom(.8);document.getElementById('out').onclick=()=>zoom(1.25);
    canvas.addEventListener('webglcontextlost',event=>{event.preventDefault();window.showError();});
    renderer.setAnimationLoop(()=>{if(document.hidden)return;controls.update();renderer.render(scene,camera);updateLabels();});
  </script>
</body>
</html>
