     // 擊球沿地面直線滾向游擊手正面，不偏離守備員接球點。
     const u=smooth(Math.max(0,(t-.12)/.26));
     ball.position.set(11*u,.42,-16*u);
   }else if(t<.43){
     ball.position.set(11,2.15,-16); // 游擊手接穩球
   }else if(t<.61){
     throwBall(new T.Vector3(11,2.5,-16),new T.Vector3(18,2.3,-18),(t-.43)/.18,1.7);
   }else if(t<.66){
     ball.position.set(18,2.3,-18); // 二壘手接球並踩二壘
   }else if(t<.84){
     throwBall(new T.Vector3(18,2.3,-18),new T.Vector3(18,2.2,0),(t-.66)/.18,3);
   }else{
     ball.position.set(18,2.2,0); // 一壘手接球，打者尚未抵達
   }
 }else if(selected==='sacrifice'){
   // 觸擊球在投手前滾動，投手撿起後傳一壘。
   if(t<.52){const u=smooth(Math.max(0,(t-.2)/.32));ball.position.set(6*u,.38,-5*u);}
   else throwBall(new T.Vector3(6,2.1,-5),new T.Vector3(18,1.9,0),Math.min(1,(t-.52)/.3),2.5);
 }else if(plan.throwTo!==null&&t>(selected==='triple'?.84:.65)){
   const to=base[plan.throwTo],from=target.clone();from.y=2.6;
   const u=(t-(selected==='triple'?.84:.65))/(selected==='triple'?.16:.29);
   throwBall(from,new T.Vector3(to.x,1.6,to.z),u);
 }
}
const cases={
single:['一壘安打','球落地後打者安全抵達一壘。',[home,one],0,0,0,0,'hit'],
double:['二壘安打','打者依序踩過一壘、二壘。',[home,one,two],0,0,0,0,'hit'],
triple:['三壘安打','球飛向右外野，右外野手追球回傳；打者搶先踩上三壘形成三壘安打。',[home,one,two,three],0,0,0,0,'hit'],
homer:['全壘打','無人上壘的全壘打，打者跑完四壘得 1 分。',[home,one,two,three,home],1,0,0,0,'homer'],
walk:['四壞保送','累積四顆壞球，打者獲得一壘。',[home,one],0,0,0,4,'pitch'],
strike:['三振出局','打者揮棒落空，球通過球棒進入捕手手套；第三好球由捕手合法接捕，打者出局。',[home],0,1,3,0,'pitch'],
fly:['飛球接殺','打者擊出高飛球，中外野手移位，在落地前接住形成飛球出局。',[home],0,1,0,0,'fly'],
ground:['滾地出局','游擊手接住滾地球後傳一壘，球先到一壘手完成出局。',[home,new T.Vector3(12,0,0)],0,1,0,0,'ground'],
steal:['盜二壘','一壘跑者起跑盜二壘；捕手接球後立即傳向二壘，跑者示範安全上壘。',[one,two],0,0,0,0,'steal'],
doubleplay:['雙殺守備','球正面滾向游擊手；游擊手接球傳二壘，球先於一壘跑者到達；二壘手踩壘後轉傳一壘，球也先於打者抵達，完成 6-4-3 雙殺。',[home,new T.Vector3(11,0,0)],0,2,0,0,'doubleplay'],
sacrifice:['犧牲觸擊','一壘有跑者，打者將球點到投手前方，投手撿球傳一壘使打者出局，一壘跑者推進二壘。',[home,new T.Vector3(12,0,0)],0,1,0,0,'sacrifice'],
tag:['觸殺出局','跑者從一壘衝向二壘，捕手接球後傳二壘手，二壘手接球並持球觸及尚未安全上壘的跑者，判觸殺出局。',[one,new T.Vector3(16.6,0,-16.6)],0,1,0,0,'tag']
};
const $=id=>document.getElementById(id),rules=$('rules');let selected='single',start=performance.now(),paused=false,pauseAt=0,speed=1,finished=false;
Object.entries(cases).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v[0];b.dataset.key=k;b.onclick=()=>choose(k);rules.append(b)});
function choose(k){selected=k;start=performance.now();paused=false;finished=false;$('pause').textContent='⏸ 暫停';const c=cases[k];$('title').textContent=c[0];$('explain').innerHTML='<b>'+c[0]+'</b><p>'+c[1]+'</p>';$('status').textContent='動畫播放中';for(const id of ['runs','outs','strikes','balls'])$(id).textContent='0';rules.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.key===k));drawStadiumScore();}
$('replay').onclick=()=>choose(selected);$('pause').onclick=()=>{if(paused){start+=performance.now()-pauseAt;paused=false}else{pauseAt=performance.now();paused=true}$('pause').textContent=paused?'▶ 繼續':'⏸ 暫停'};
$('speed').onclick=()=>{speed=speed===1? .5:speed===.5?2:1;$('speed').textContent='速度 '+speed+'×';choose(selected)};
$('reset').onclick=()=>{camera.position.set(46,57,66);orbit.target.set(8,0,-13);orbit.update()};
$('top').onclick=()=>{camera.position.set(9,90,-9);orbit.target.set(9,0,-9);orbit.update()};
function resize(){const w=mount.clientWidth,h=mount.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(mount);resize();
function along(path,t){if(path.length===1)return path[0].clone();const n=path.length-1,f=Math.min(n-.00001,t*n),i=Math.floor(f),u=f-i;return path[i].clone().lerp(path[i+1],u)}
function loop(now){requestAnimationFrame(loop);const c=cases[selected],time=(paused?pauseAt:now)-start,duration=Math.max(3500,(c[2].length-1)*1300)/speed,t=Math.min(1,Math.max(0,time/duration)),kind=c[7],pitch=kind==='pitch'||kind==='steal',hit=kind==='hit'||kind==='homer',fly=kind==='fly',ground=kind==='ground'||kind==='doubleplay'||kind==='sacrifice'||kind==='tag';
let rt=t;if(pitch)rt=Math.max(0,(t-.45)/.55);else if(hit||fly||ground)rt=Math.max(0,(t-.22)/.78);
// 犧牲觸擊及雙殺：原有跑者從一壘向二壘移動。
leadRunner.visible=selected==='sacrifice'||selected==='doubleplay';
if(leadRunner.visible){
 const advance=selected==='sacrifice'?smooth((t-.25)/.65):Math.min(.92,smooth((t-.2)/.53)*.92);
 const p=one.clone().lerp(two,advance);
 leadRunner.position.set(p.x,.1,p.z);
 leadRunner.rotation.y=Math.atan2(two.x-one.x,two.z-one.z);
}
const rp=along(c[2],rt);
if(selected==='doubleplay'){
 // 打者於一壘傳球到達 (.84) 後仍距一壘一段距離。
 const batterProgress=Math.min(.92,smooth((t-.24)/.76)*.92);
 rp.copy(home).lerp(one,batterProgress);
}
if(selected==='tag'){
 // 跑者由一壘盜向二壘，接近二壘時遭持球二壘手觸殺。
 const u=smooth((t-.17)/.63);
 rp.copy(one).lerp(new T.Vector3(16.6,0,-16.6),u);
}
runner.position.set(rp.x,.1+Math.abs(Math.sin(now*.013))*((rt>0&&rt<1)? .13:0),rp.z+(rt===0&&selected!=='steal'&&selected!=='tag'?.9:0));
if(c[2].length>1){const dest=along(c[2],Math.min(1,rt+.02));runner.rotation.y=selected==='doubleplay'?Math.atan2(one.x-home.x,one.z-home.z):Math.atan2(dest.x-rp.x,dest.z-rp.z)}
const pitcher=fielders[0];
// 三振情境：明確揮棒落空；球先穿過本壘才進捕手手套。
const swing=selected==='strike'||hit||fly||ground&&selected!=='sacrifice';
const swingPhase=Math.max(0,Math.min(1,(t-.18)/.25));
bat.rotation.z=-.5+(swing?Math.sin(swingPhase*Math.PI)*1.65:selected==='sacrifice'?.9:0);
hitter.rotation.y=Math.atan2(towardPitcher.x,towardPitcher.z)+(swing?Math.sin(swingPhase*Math.PI)*.42:0);
if(pitch){const u=Math.min(1,t*2.2);ball.position.set(9*(1-u),1.7+u*.5,-9*(1-u));if(selected==='strike'&&u>.82)ball.position.y=1.5;}
else if(hit||fly||ground){
 const u=Math.min(1,t*2.6);
 if(selected==='triple'){
   // 右外野方向，跑者抵達三壘後守備員才完成回傳。
   const v=Math.min(1,t/.62);ball.position.set(49*v,1.2+Math.sin(Math.PI*v)*15,-25*v);
 }else if(selected==='fly'){
   // 高飛球拋物線：最高約 27 單位，落在中外野手附近。
   const v=Math.min(1,t/.72);ball.position.set(34*v,2+Math.sin(Math.PI*v)*27,-39*v);
 }else{
   const z=-u*(hit?(kind==='homer'?75:38):22),x=u*(kind==='homer'?38:kind==='ground'?12:18);
   ball.position.set(x,kind==='homer'?2+u*(1-u)*55:kind==='ground'?.45:2+u*(1-u)*12,z);
 }
}
else{ball.position.set(9,1.4,-9)}
animateDefense(kind,t,now);
if(!finished&&t===1){finished=true;['runs','outs','strikes','balls'].forEach((id,i)=>$(id).textContent=c[i+3]);$('status').textContent='示範完成 · 可重新播放';drawStadiumScore()}
orbit.update();renderer.render(scene,camera)}
choose('single');requestAnimationFrame(loop);
</script></body></html>
