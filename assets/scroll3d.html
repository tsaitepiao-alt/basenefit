<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D互動球場 · basenefit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#d9e8d7;color:#f2f5ee;font:16px/1.8 -apple-system,"PingFang TC",system-ui,sans-serif;overflow-x:hidden}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;background:linear-gradient(180deg,rgba(8,12,9,.85),transparent);pointer-events:none}
  #topbar b{color:#cbf24c;letter-spacing:.5px}
  #topbar a{pointer-events:auto;color:#dfe6d6;text-decoration:none;font-size:13px;border:1px solid rgba(203,242,76,.4);
    border-radius:999px;padding:6px 13px;background:rgba(12,18,14,.6)}
  #field-labels{position:fixed;left:16px;bottom:52px;z-index:4;pointer-events:none;max-width:min(420px,calc(100vw - 32px));padding:12px 18px;border-radius:12px;background:rgba(9,27,32,.9);border:1px solid rgba(203,242,76,.5);box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px);font:600 13px/1.6 system-ui;color:#f3f8ed}
  #hotspots{position:fixed;inset:0;z-index:3;pointer-events:none}
  .hotspot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;min-width:36px;height:36px;border-radius:999px;border:2px solid #fff;background:#0a4032;color:white;font:700 14px system-ui;box-shadow:0 2px 10px #0009;touch-action:manipulation}
  .hotspot:hover,.hotspot:focus-visible{background:#c04f2a;outline:2px solid #fff}
  #prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#cbf24c,#8fd7a0);z-index:6;width:0}
  section{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;padding:0 22px}
  section[data-side="left"]{justify-content:flex-start}
  section[data-side="right"]{justify-content:flex-end}
  section[data-side="center"]{justify-content:center;text-align:center}
  .card{max-width:430px;background:rgba(10,16,12,.72);border:1px solid rgba(203,242,76,.28);
    border-radius:18px;padding:22px 24px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .card .eb{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:2.4px;color:#cbf24c;opacity:.85}
  .card h2{font-size:27px;line-height:1.25;margin:9px 0 8px;letter-spacing:.5px}
  .card p{font-size:14.5px;color:#c3ccb8}
  .card .big{font:800 34px/1.1 ui-monospace,Menlo,monospace;color:#cbf24c;letter-spacing:1px;margin:6px 0}
  .card ul{margin:8px 0 0 18px;font-size:14px;color:#c3ccb8}
  .card li{margin:3px 0}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:#a9b79c;
    letter-spacing:1px;animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
  #load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:#d9e8d7;color:#295542;font:600 14px/1 ui-monospace,Menlo,monospace;letter-spacing:2px}
  #load.off{opacity:0;pointer-events:none;transition:opacity .6s}
  @media(max-width:600px){.card{padding:18px 18px}.card h2{font-size:22px}.big{font-size:28px}}
</style>
</head>
<body>
<div id="prog"></div>
<canvas id="cv"></canvas>
<div id="topbar"><b>basenefit · 3D互動球場</b><a href="../index.html#/scroll3d">← 回到球場</a></div>
<div id="load">LOADING 3D…</div>

<div id="hint">拖曳旋轉 · 滾輪縮放 · 點選場上位置查看介紹</div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  var cv=document.getElementById('cv');
  if(!window.THREE){ document.getElementById('load').textContent='需要網路載入 3D 引擎'; return; }
  var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0xb7d8e7);
  scene.fog=new THREE.Fog(0xb7d8e7,850,1800);
  var camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,4000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x688d65,1.7));
  var dir=new THREE.DirectionalLight(0xfff6df,2.0); dir.position.set(180,320,120); scene.add(dir);
  // 單一座標系：本壘 (0,0)，一壘在畫面右側，外野朝 +Z。
  var field=new THREE.Group();scene.add(field);
  var green=new THREE.MeshLambertMaterial({color:0x185d36});
  var clay=new THREE.MeshLambertMaterial({color:0xb65031,side:THREE.DoubleSide});
  var white=new THREE.MeshBasicMaterial({color:0xf5f3e9});
  function plane(shape,material,y){
    var m=new THREE.Mesh(new THREE.ShapeGeometry(shape),material);
    m.rotation.x=-Math.PI/2;m.position.y=y;field.add(m);return m;
  }
  function polygon(points,mat,y){
    var sh=new THREE.Shape();points.forEach(function(p,i){i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]);});sh.closePath();return plane(sh,mat,y);
  }
  function line(a,b,width,y,mat){
    var dx=b[0]-a[0],dz=b[1]-a[1],m=new THREE.Mesh(new THREE.BoxGeometry(width,.07,Math.hypot(dx,dz)),mat||white);
    m.position.set((a[0]+b[0])/2,y,(a[1]+b[1])/2);m.rotation.y=Math.atan2(dx,dz);field.add(m);
  }
  var turf=document.createElement('canvas');turf.width=turf.height=512;
  var tx=turf.getContext('2d');tx.fillStyle='#185b37';tx.fillRect(0,0,512,512);
  for(var i=0;i<8;i++)for(var j=0;j<8;j++){tx.fillStyle=(i+j)%2?'#1c6b40':'#125130';tx.fillRect(i*64,j*64,64,64);}
  var texture=new THREE.CanvasTexture(turf);texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(10,10);
  var grass=new THREE.Mesh(new THREE.PlaneGeometry(360,360),new THREE.MeshLambertMaterial({map:texture}));
  grass.rotation.x=-Math.PI/2;grass.position.set(0,-.14,85);field.add(grass);
  // 內野紅土弧形區，外野草皮在紅土外側。
  var d=new THREE.Shape();d.moveTo(0,12);d.lineTo(-62,-62);
  for(var k=0;k<=80;k++){var angle=Math.PI*.75-k*Math.PI*.5/80;d.lineTo(Math.cos(angle)*89,-Math.sin(angle)*89);}
  d.lineTo(62,-62);d.lineTo(0,12);d.closePath();plane(d,clay,.02);
  polygon([[0,7],[-24,27.43],[0,51],[24,27.43]],green,.08);
  // 投手丘圓形紅土及投手板。
  var mound=new THREE.Mesh(new THREE.CylinderGeometry(5.5,5.5,.3,64),clay);mound.position.set(0,.17,18.44);field.add(mound);
  var plate=new THREE.Mesh(new THREE.BoxGeometry(.61,.08,.152),white);plate.position.set(0,.38,18.44);field.add(plate);
  var bases=[[0,0],[-27.43,27.43],[0,54.86],[27.43,27.43]];
  for(var bi=1;bi<4;bi++){var base=new THREE.Mesh(new THREE.BoxGeometry(.8,.14,.8),white);base.position.set(bases[bi][0],.3,bases[bi][1]);base.rotation.y=Math.PI/4;field.add(base);}
  polygon([[0,-.5],[-.22,-.15],[-.22,.22],[.22,.22],[.22,-.15]],white,.31);
  for(var li=0;li<4;li++)line(bases[li],bases[(li+1)%4],.19,.27,white);
  line([0,0],[-104,104],.22,.29);line([0,0],[104,104],.22,.29);
  // 打擊區
  var batter=[[-2.1,-1.5],[-.8,-1.5],[.8,-1.5],[2.1,-1.5]];
  [-1,1].forEach(function(sign){var x=sign*1.45;line([x-.6,-2.2],[x+.6,-2.2],.1,.3);line([x-.6,1.1],[x+.6,1.1],.1,.3);line([x-.6,-2.2],[x-.6,1.1],.1,.3);line([x+.6,-2.2],[x+.6,1.1],.1,.3);});
  // 弧形外野牆，統一朝向與尺寸。
  var wallMat=new THREE.MeshLambertMaterial({color:0x104c40});
  for(var w=0;w<100;w++){var aa=Math.PI*.25+w*Math.PI*.5/100,bb=Math.PI*.25+(w+1)*Math.PI*.5/100;
    var p=[Math.cos(aa)*148,Math.sin(aa)*148],q=[Math.cos(bb)*148,Math.sin(bb)*148];
    var dx=q[0]-p[0],dz=q[1]-p[1];
    var wall=new THREE.Mesh(new THREE.BoxGeometry(.7,5,Math.hypot(dx,dz)+.1),wallMat);
    wall.position.set((p[0]+q[0])/2,2.4,(p[1]+q[1])/2);wall.rotation.y=Math.atan2(dx,dz);field.add(wall);
  }
  var fieldLabels=document.createElement('div');
  fieldLabels.id='field-labels';
  fieldLabels.textContent='點選球場上的位置，查看守備介紹與尺寸。';
  document.body.appendChild(fieldLabels);
  var spots=[
    {name:'1 號｜投手',info:'投手丘：投球、牽制與守備補位。投手板至本壘尖端 18.44 公尺。',x:0,z:18.44},
    {name:'2 號｜捕手',info:'本壘後方：接捕、配球、阻殺及指揮守備。',x:0,z:-5},
    {name:'3 號｜一壘手',info:'一壘附近：接傳球、牽制及防守一壘線。',x:-27.43,z:27.43},
    {name:'4 號｜二壘手',info:'一、二壘間：防守滾地球、補位與雙殺。',x:-12,z:42},
    {name:'5 號｜三壘手',info:'三壘附近：處理強勁滾地球、短打及長傳。',x:27.43,z:27.43},
    {name:'6 號｜游擊手',info:'二、三壘間：守備範圍廣，負責雙殺轉傳。',x:12,z:42},
    {name:'7 號｜左外野手',info:'左外野：接飛球、追球與回傳內野。',x:-73,z:92},
    {name:'8 號｜中外野手',info:'中外野：大範圍防守、指揮外野及回傳。',x:0,z:121.92},
    {name:'9 號｜右外野手',info:'右外野：接飛球，支援三壘與本壘長傳。',x:73,z:92},
    {name:'球場尺寸',info:'壘間 27.43 公尺；投手板至本壘 18.44 公尺；中外野參考距離 121.92 公尺。',x:0,z:60}
  ];
  var markers=[];
  spots.forEach(function(p,i){
    var marker=new THREE.Mesh(new THREE.SphereGeometry(i===9?1.8:1.3,16,12),new THREE.MeshBasicMaterial({color:i===9?0xffd05a:0xffffff,transparent:true,opacity:.5,depthTest:false}));
    marker.position.set(p.x,3.5,p.z);marker.userData.spot=i;field.add(marker);markers.push(marker);
  });
  var raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
  cv.addEventListener('click',function(e){
    var box=cv.getBoundingClientRect();
    pointer.set((e.clientX-box.left)/box.width*2-1,-(e.clientY-box.top)/box.height*2+1);
    raycaster.setFromCamera(pointer,camera);
    var hits=raycaster.intersectObjects(markers,false);
    if(!hits.length)return;
    var p=spots[hits[0].object.userData.spot];
    fieldLabels.textContent=p.name+'｜'+p.info;
  });
  var model=null;

  document.getElementById('load').classList.add('off');
  window.__ready=true;

  var controls=new THREE.OrbitControls(camera,cv);
  camera.position.set(0,225,-225);
  controls.target.set(0,0,66);
  controls.enablePan=true;
  controls.enableDamping=true;
  controls.dampingFactor=.08;
  controls.minDistance=30;
  controls.maxDistance=650;
  controls.maxPolarAngle=Math.PI*.48;
  controls.update();
  addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  (function loop(){
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene,camera);
  })();
})();
</script>
</body>
</html>
