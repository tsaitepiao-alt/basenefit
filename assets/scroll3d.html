<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D互動球場 · basenefit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#d9e8d7;color:#f2f5ee;font:16px/1.8 -apple-system,"PingFang TC",system-ui,sans-serif;overflow-x:hidden}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;background:linear-gradient(180deg,rgba(8,12,9,.85),transparent);pointer-events:none}
  #topbar b{color:#cbf24c;letter-spacing:.5px}
  #topbar a{pointer-events:auto;color:#dfe6d6;text-decoration:none;font-size:13px;border:1px solid rgba(203,242,76,.4);
    border-radius:999px;padding:6px 13px;background:rgba(12,18,14,.6)}
  #field-labels{position:fixed;left:16px;bottom:52px;z-index:4;pointer-events:none;max-width:min(420px,calc(100vw - 32px));padding:12px 18px;border-radius:12px;background:rgba(9,27,32,.9);border:1px solid rgba(203,242,76,.5);box-shadow:0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px);font:600 13px/1.6 system-ui;color:#f3f8ed}
  #prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#cbf24c,#8fd7a0);z-index:6;width:0}
  section{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;padding:0 22px}
  section[data-side="left"]{justify-content:flex-start}
  section[data-side="right"]{justify-content:flex-end}
  section[data-side="center"]{justify-content:center;text-align:center}
  .card{max-width:430px;background:rgba(10,16,12,.72);border:1px solid rgba(203,242,76,.28);
    border-radius:18px;padding:22px 24px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .card .eb{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:2.4px;color:#cbf24c;opacity:.85}
  .card h2{font-size:27px;line-height:1.25;margin:9px 0 8px;letter-spacing:.5px}
  .card p{font-size:14.5px;color:#c3ccb8}
  .card .big{font:800 34px/1.1 ui-monospace,Menlo,monospace;color:#cbf24c;letter-spacing:1px;margin:6px 0}
  .card ul{margin:8px 0 0 18px;font-size:14px;color:#c3ccb8}
  .card li{margin:3px 0}
  #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:#a9b79c;
    letter-spacing:1px;animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
  #load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:#d9e8d7;color:#295542;font:600 14px/1 ui-monospace,Menlo,monospace;letter-spacing:2px}
  #load.off{opacity:0;pointer-events:none;transition:opacity .6s}
  @media(max-width:600px){.card{padding:18px 18px}.card h2{font-size:22px}.big{font-size:28px}}
</style>
</head>
<body>
<div id="prog"></div>
<canvas id="cv"></canvas>
<div id="topbar"><b>basenefit · 3D互動球場</b><a href="../index.html#/scroll3d">← 回到球場</a></div>
<div id="load">LOADING 3D…</div>

<div id="hint">拖曳旋轉 · 滾輪縮放 · 點選場上位置查看介紹</div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  var cv=document.getElementById('cv');
  if(!window.THREE){ document.getElementById('load').textContent='需要網路載入 3D 引擎'; return; }
  var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0xc8e4ed);
  scene.fog=new THREE.Fog(0xc8e4ed,850,1800);
  var camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,4000);
  scene.add(new THREE.HemisphereLight(0xffffff,0x688d65,1.7));
  var dir=new THREE.DirectionalLight(0xfff6df,2.0); dir.position.set(180,320,120); scene.add(dir);
  // 日間球場：外圍草地、紅土內野、鮮明界線與壘包，與 GLB 場景疊加。
  var field=new THREE.Group(); scene.add(field);
  var grass=new THREE.Mesh(new THREE.PlaneGeometry(1700,1700),new THREE.MeshLambertMaterial({color:0x4c9a60}));
  grass.rotation.x=-Math.PI/2;grass.position.y=-1.5;field.add(grass);
  function groundShape(points,color,y){
    var sh=new THREE.Shape();points.forEach(function(p,i){if(!i)sh.moveTo(p[0],-p[1]);else sh.lineTo(p[0],-p[1]);});sh.closePath();
    var m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:color,side:THREE.DoubleSide,depthWrite:false}));
    m.rotation.x=-Math.PI/2;m.position.y=y;field.add(m);return m;
  }
  function stripe(a,b,color,width,y){
    var v1=new THREE.Vector3(a[0],y,a[1]),v2=new THREE.Vector3(b[0],y,b[1]),d=v2.clone().sub(v1);
    var mesh=new THREE.Mesh(new THREE.BoxGeometry(width,.18,d.length()),new THREE.MeshBasicMaterial({color:color}));
    mesh.position.copy(v1.add(v2).multiplyScalar(.5));mesh.rotation.y=Math.atan2(d.x,d.z);field.add(mesh);
  }
  // 以場地本壘位於 (0,0,0)、外野朝 +Z 的標準座標製作覆蓋層。
  groundShape([[0,0],[-27.43,27.43],[0,54.86],[27.43,27.43]],0xb75c39,-.95);
  groundShape([[-13.7,13.7],[-27.43,27.43],[0,54.86],[27.43,27.43],[13.7,13.7]],0x438e55,-.88);
  [[0,0],[-27.43,27.43],[0,54.86],[27.43,27.43]].forEach(function(p,i,arr){stripe(p,arr[(i+1)%4],0xffffff,.55,-.7);});
  stripe([0,0],[-115,115],0xffffff,.65,-.7);
  stripe([0,0],[115,115],0xffffff,.65,-.7);
  var mound=new THREE.Mesh(new THREE.CylinderGeometry(5.3,5.3,.4,48),new THREE.MeshLambertMaterial({color:0xb75c39}));
  mound.position.set(0,-.55,18.44);field.add(mound);
  [[0,0],[-27.43,27.43],[0,54.86],[27.43,27.43]].forEach(function(p){
    var base=new THREE.Mesh(new THREE.BoxGeometry(2.3,.25,2.3),new THREE.MeshBasicMaterial({color:0xffffff}));
    base.position.set(p[0],-.48,p[1]);base.rotation.y=Math.PI/4;field.add(base);
  });
  var fieldLabels=document.createElement('div');
  fieldLabels.id='field-labels';
  fieldLabels.textContent='點選球場上的位置，查看守備介紹與尺寸。';
  document.body.appendChild(fieldLabels);
  var spots=[
    {name:'1 號｜投手',info:'投手丘：投球、牽制與守備補位。投手板至本壘尖端 18.44 公尺。',x:0,z:18.44},
    {name:'2 號｜捕手',info:'本壘後方：接捕、配球、阻殺及指揮守備。',x:0,z:-5},
    {name:'3 號｜一壘手',info:'一壘附近：接傳球、牽制及防守一壘線。',x:-27.43,z:27.43},
    {name:'4 號｜二壘手',info:'一、二壘間：防守滾地球、補位與雙殺。',x:-12,z:42},
    {name:'5 號｜三壘手',info:'三壘附近：處理強勁滾地球、短打及長傳。',x:27.43,z:27.43},
    {name:'6 號｜游擊手',info:'二、三壘間：守備範圍廣，負責雙殺轉傳。',x:12,z:42},
    {name:'7 號｜左外野手',info:'左外野：接飛球、追球與回傳內野。',x:-73,z:92},
    {name:'8 號｜中外野手',info:'中外野：大範圍防守、指揮外野及回傳。',x:0,z:121.92},
    {name:'9 號｜右外野手',info:'右外野：接飛球，支援三壘與本壘長傳。',x:73,z:92},
    {name:'球場尺寸',info:'壘間 27.43 公尺；投手板至本壘 18.44 公尺；中外野參考距離 121.92 公尺。',x:0,z:60}
  ];
  var markers=[];
  spots.forEach(function(p,i){
    var marker=new THREE.Mesh(new THREE.SphereGeometry(i===9?3.2:2.3,16,12),new THREE.MeshBasicMaterial({color:i===9?0xffd05a:0xffffff,transparent:true,opacity:.95,depthTest:false}));
    marker.position.set(p.x,3.5,p.z);marker.userData.spot=i;field.add(marker);markers.push(marker);
  });
  var raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
  cv.addEventListener('click',function(e){
    var box=cv.getBoundingClientRect();
    pointer.set((e.clientX-box.left)/box.width*2-1,-(e.clientY-box.top)/box.height*2+1);
    raycaster.setFromCamera(pointer,camera);
    var hits=raycaster.intersectObjects(markers,false);
    if(!hits.length)return;
    var p=spots[hits[0].object.userData.spot];
    fieldLabels.textContent=p.name+'｜'+p.info;
  });
  var model=null;

  new THREE.GLTFLoader().load('baseball_stadium.glb',function(gl){
    model=gl.scene;
    var b=new THREE.Box3().setFromObject(model), c=new THREE.Vector3(), s=new THREE.Vector3();
    b.getCenter(c); b.getSize(s);
    model.position.x-=c.x; model.position.z-=c.z;         // 置中
    scene.add(model);
    // 隱藏 GLB 中常見的反向 3D 文字物件，改由正向的畫面標籤取代。
    model.traverse(function(o){
      if(o.isMesh&&/(text|label|letter|word|font|文字|標示)/i.test(o.name||''))o.visible=false;
    });
    // 避免新地面與既有模型重疊；保留原有看台、外野牆等模型。
    document.getElementById('load').classList.add('off');
    window.__ready=true;
  },undefined,function(){ document.getElementById('load').textContent='模型載入失敗'; });

  var controls=new THREE.OrbitControls(camera,cv);
  camera.position.set(0,195,-160);
  controls.target.set(0,0,48);
  controls.enableDamping=true;
  controls.dampingFactor=.08;
  controls.minDistance=30;
  controls.maxDistance=650;
  controls.maxPolarAngle=Math.PI*.48;
  controls.update();
  addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  (function loop(){
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene,camera);
  })();
})();
</script>
</body>
</html>
