<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全壘打挑戰 | basenefit</title><style>
*{box-sizing:border-box}body{margin:0;background:#061b31;color:#f2fbff;font:15px/1.5 system-ui,"Noto Sans TC",sans-serif}.game{max-width:1200px;margin:auto;padding:12px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.head h1{margin:0;font-size:clamp(20px,3vw,30px)}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{background:#123d5a;border:1px solid #2b7eaa;padding:7px 11px;border-radius:10px;font-weight:700}.arena{position:relative;overflow:hidden;border:2px solid #287aa5;border-radius:16px;background:#0d4266;box-shadow:0 0 36px #00baff22}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:manipulation}.message{position:absolute;top:13%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(17px,3vw,32px);font-weight:900;text-shadow:0 3px 9px #001d30;pointer-events:none;white-space:nowrap}.hud{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:13px 0}.hud button,.hud select{border:1px solid #55b9e8;background:#145479;color:white;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}.hud button.primary{background:#b6ed57;color:#0c2c3c;border:0;font-size:19px}.help{color:#b9e0f1;text-align:center}.meter{height:11px;background:#214a5c;border-radius:20px;overflow:hidden;max-width:430px;margin:10px auto}.meter>div{height:100%;width:0;background:linear-gradient(90deg,#ff7043,#f7f35b,#56f19a)}@media(max-width:600px){.game{padding:6px}.arena{border-radius:9px}.hud button{flex:1}.message{top:10%}}</style></head><body><div class="game"><div class="head"><h1>⚾ 3D 全壘打挑戰 <small style="font-size:12px;color:#7adfff">HOME RUN DERBY</small></h1><div class="stats"><span id="remaining">剩餘 10 球</span><span id="score">分數 0</span><span id="homers">全壘打 0</span><span id="best">最高 0</span></div></div><div class="arena"><canvas id="field" width="1120" height="630" aria-label="透視棒球場與投球動畫"></canvas><div class="message" id="message">準備挑戰！</div></div><div class="meter"><div id="meter"></div></div><div class="hud"><button id="pitch">⚾ 開始投球</button><button id="swing" class="primary">🏏 揮棒！</button><button id="reset">↻ 重新挑戰</button><label>球速 <select id="difficulty"><option value="easy">初級</option><option value="normal" selected>一般</option><option value="hard">進階</option></select></label></div><p class="help">球飛近本壘板時點擊「揮棒」，或按空白鍵／直接點球場。每回合 10 球，擊球越準，飛行越遠！</p></div><script>
(()=>{'use strict';const canvas=document.getElementById('field'),c=canvas.getContext('2d');const el=id=>document.getElementById(id);let left=10,score=0,homers=0,best=Number(localStorage.getItem('basenefit-hr-best')||0),phase='ready',start=0,duration=1700,ball=null,flight=null,flashUntil=0,last=0;el('best').textContent='最高 '+best;
function text(t){el('message').textContent=t}function update(){el('remaining').textContent='剩餘 '+left+' 球';el('score').textContent='分數 '+score;el('homers').textContent='全壘打 '+homers;el('best').textContent='最高 '+best}
function line(points,color,width=2){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function poly(points,color){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fillStyle=color;c.fill()}
function ellipse(x,y,rx,ry,color){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);c.fillStyle=color;c.fill()}
function scene(){let sky=c.createLinearGradient(0,0,0,430);sky.addColorStop(0,'#0a2748');sky.addColorStop(.7,'#2b85ae');sky.addColorStop(1,'#8ed1df');c.fillStyle=sky;c.fillRect(0,0,1120,630);
for(let i=0;i<25;i++){let x=i*49;c.fillStyle=i%2?'#173a54':'#224e68';c.fillRect(x,165+(i%4)*12,47,125);for(let j=0;j<4;j++)ellipse(x+12+j*8,188+(i%4)*12,2,2,'#d6f5fc')}
poly([[0,305],[1120,305],[1120,630],[0,630]],'#24784f');for(let i=0;i<13;i++)poly([[0,320+i*28],[1120,320+i*28],[1120,329+i*28],[0,329+i*28]],i%2?'#2a8455':'#216e49');
poly([[560,355],[190,610],[930,610]],'#ad7148');poly([[560,366],[310,630],[810,630]],'#328b57');line([[560,355],[130,630]],'#f9f7e3',4);line([[560,355],[990,630]],'#f9f7e3',4);
poly([[550,359],[560,354],[570,359],[560,364]],'#f8e8bd');poly([[541,580],[560,571],[579,580],[560,590]],'#f4f3ea');
ellipse(560,369,19,8,'#a47652');ellipse(560,337,9,22,'#f2f5f7');ellipse(560,315,9,10,'#153952');line([[554,345],[549,366]],'#e4e6e5',6);line([[567,345],[573,365]],'#e4e6e5',6);line([[555,325],[541,342]],'#e4e6e5',5);
line([[560,580],[560,468]],'#ffffff33',1);c.fillStyle='#e4f8ff';c.font='bold 16px system-ui';c.fillText('CENTER FIELD 400 FT',464,270);
if(phase==='pitching'&&ball){ellipse(ball.x+8,ball.y+11,ball.r*.7,ball.r*.35,'#092c3377');ellipse(ball.x,ball.y,ball.r,ball.r,'#f7f9ef');line([[ball.x-ball.r*.5,ball.y-ball.r*.6],[ball.x+ball.r*.4,ball.y+ball.r*.65]],'#ce5249',Math.max(1,ball.r*.13))}
if(phase==='flight'&&flight){const p=flight.progress,x=560+flight.side*p*310,y=545-430*Math.sin(p*Math.PI*.78)-105*p,r=Math.max(3,17*(1-p*.82));ellipse(x,y,r,r,'#fff');line([[560,548],[x,y]],'#ffffff77',3);if(p>.8&&flight.homer){c.fillStyle='#ffe67a';c.font='bold 40px system-ui';c.textAlign='center';c.fillText('HOME RUN!',560,110);c.textAlign='start'}}
if(phase==='ready'||phase==='pitching'){line([[508,518],[508,568],[612,568],[612,518],[508,518]],'#ffffff77',2);line([[560,505],[560,584]],'#ffffff55',1)}
}
function pitch(){if(phase==='pitching'||phase==='flight'||left<=0)return;phase='pitching';start=performance.now();duration={easy:2400,normal:1700,hard:1150}[el('difficulty').value];ball={x:560,y:348,r:5};text('看準球！準備揮棒')}
function finish(label,pts,homer){score+=pts;if(homer)homers++;if(score>best){best=score;localStorage.setItem('basenefit-hr-best',best)}update();text(label);phase='cooldown';flashUntil=performance.now()+1250}
function swing(){if(phase!=='pitching')return;const t=Math.min(1,(performance.now()-start)/duration),accuracy=Math.abs(t-.84);left--;if(accuracy<.13){let power=Math.max(0,1-accuracy/.13),distance=Math.round(190+power*290+Math.random()*35),homer=distance>=340;flight={progress:0,side:Math.random()*1.2-.6,distance,homer,pts:homer?100+Math.round(distance/10):distance>260?35:15};phase='flight';start=performance.now();text('擊中了！ '+distance+' FT');}else finish(t<.7?'揮棒太早！':t>.97?'揮棒太晚！':'擦棒界外！',0,false);update()}
function reset(){left=10;score=0;homers=0;phase='ready';flight=null;ball=null;text('準備挑戰！');update()}
function frame(now){const dt=Math.min(60,now-last||16);last=now;if(phase==='pitching'){const p=Math.min(1,(now-start)/duration);ball={x:560+Math.sin(p*5)*p*12,y:348+210*p*p,r:5+14*p};el('meter').style.width=(p*100)+'%';if(p>=1){left--;finish('揮棒落空！',0,false)}}else if(phase==='flight'){flight.progress=Math.min(1,flight.progress+dt/1700);if(flight.progress>=1)finish(flight.homer?'🎉 全壘打！ +'+flight.pts+' 分':flight.distance>260?'漂亮安打！ +'+flight.pts+' 分':'擊出飛球！ +'+flight.pts+' 分',flight.pts,flight.homer)}else{el('meter').style.width='0%';if(phase==='cooldown'&&now>flashUntil){phase=left?'ready':'done';if(!left)text('挑戰結束！ '+score+' 分，'+homers+' 支全壘打')}}scene();requestAnimationFrame(frame)}
el('pitch').onclick=pitch;el('swing').onclick=swing;el('reset').onclick=reset;canvas.onclick=()=>phase==='ready'?pitch():swing();window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();phase==='ready'?pitch():swing()}});update();requestAnimationFrame(frame);
})();</script></body></html>
